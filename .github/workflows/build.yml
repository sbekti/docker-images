name: Docker
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' && format('Build {0} ({1}, manual)', inputs.image, github.ref_name) ||
    startsWith(github.ref, 'refs/tags/') && format('Build {0}', github.ref_name) ||
    format('Build changed images ({0})', github.ref_name)
  }}

on:
  push:
    branches: [main]
    tags: ['*/v*.*.*']
  pull_request:
    paths:
      - 'images/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build (directory name under images/)'
        required: true
        type: choice
        options:
          - actual-cli
          - asterisk
          - freeradius
          - hermes-tools
          - radius-proxy
          - samba-ad
          - samba-rodc

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------
  # Determine which images need to be built
  # ---------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_images: ${{ steps.set-matrix.outputs.has_images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine images to build
        id: set-matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          SELECTED_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail

          IMAGES=()

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            IMAGES+=("$SELECTED_IMAGE")
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            IMAGE_NAME="${TAG%%/*}"
            IMAGES+=("$IMAGE_NAME")
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              BASE_SHA="$PR_BASE_SHA"
            else
              BASE_SHA="$PUSH_BEFORE_SHA"
            fi

            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              echo "Cannot determine a valid base commit for $EVENT_NAME." >&2
              exit 1
            fi

            mapfile -t CHANGED_FILES < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")

            BUILD_ALL=false
            for file in "${CHANGED_FILES[@]}"; do
              if [[ "$file" == ".github/workflows/build.yml" ]]; then
                BUILD_ALL=true
                break
              fi
            done

            for dir in images/*/; do
              IMAGE_NAME=$(basename "$dir")
              if [[ "$BUILD_ALL" == "true" ]]; then
                IMAGES+=("$IMAGE_NAME")
                continue
              fi

              for file in "${CHANGED_FILES[@]}"; do
                if [[ "$file" == "images/${IMAGE_NAME}/"* ]]; then
                  IMAGES+=("$IMAGE_NAME")
                  break
                fi
              done
            done
          fi

          for image in "${IMAGES[@]}"; do
            if [[ ! -f "images/${image}/Dockerfile" ]]; then
              echo "Unknown image: ${image}" >&2
              exit 1
            fi
          done

          if [ ${#IMAGES[@]} -eq 0 ]; then
            echo "matrix={\"image\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_images=false" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${IMAGES[@]}" | jq -R . | jq -sc '{"image": .}')
            echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
            echo "has_images=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Images to build: ${IMAGES[*]:-none}"

  # ---------------------------------------------------------
  # Build images on pull requests without publishing
  # ---------------------------------------------------------
  build:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.has_images == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
    with:
      job-name-prefix: ${{ matrix.image }}
      output: image
      push: false
      platforms: linux/amd64,linux/arm64
      context: images/${{ matrix.image }}
      meta-images: ghcr.io/sbekti/${{ matrix.image }}
      set-meta-labels: true
      cache: true
      cache-mode: max
      cache-scope: ${{ matrix.image }}

  # ---------------------------------------------------------
  # Build and publish images on main, tags, and manual runs
  # ---------------------------------------------------------
  publish:
    needs: detect
    if: github.event_name != 'pull_request' && needs.detect.outputs.has_images == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      job-name-prefix: ${{ matrix.image }}
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      context: images/${{ matrix.image }}
      meta-images: ghcr.io/sbekti/${{ matrix.image }}
      meta-tags: |
        type=match,pattern=.+/(v.+),group=1,enable=${{ startsWith(github.ref, 'refs/tags/') }}
        type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
        type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      set-meta-labels: true
      cache: true
      cache-mode: max
      cache-scope: ${{ matrix.image }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # One stable result for branch protection and Renovate
  # ---------------------------------------------------------
  gate:
    name: Image build gate
    if: always()
    needs:
      - detect
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify required jobs
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DETECT_RESULT: ${{ needs.detect.result }}
          EVENT_NAME: ${{ github.event_name }}
          HAS_IMAGES: ${{ needs.detect.outputs.has_images }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          if [[ "$DETECT_RESULT" != "success" ]]; then
            echo "Image detection failed." >&2
            exit 1
          fi

          if [[ "$HAS_IMAGES" != "true" ]]; then
            echo "No images require a build."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            REQUIRED_RESULT="$BUILD_RESULT"
          else
            REQUIRED_RESULT="$PUBLISH_RESULT"
          fi

          if [[ "$REQUIRED_RESULT" != "success" ]]; then
            echo "Required image jobs finished with: $REQUIRED_RESULT" >&2
            exit 1
          fi
